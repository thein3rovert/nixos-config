id: homelab-services-backup
namespace: ops

description: >-
  Backup specific homelab services to my homelab s3 bucket, this workflow
  runs an ansible playbook that backup nixos services and container services
  to homelab garage s3 bucket.

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 0"
    disabled: false
    timezone: "Europe/London"

tasks:
  - id: working_dir
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: clone-repo
        type: io.kestra.plugin.git.Clone
        url: https://github.com/thein3rovert/playbooks
        branch: main

      - id: run-backup
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          image: willhallonline/ansible:latest
          volumes:
            - "{{workingDir}}:{{workingDir}}"
        env:
          ANSIBLE_VAULT_PASSWORD: "{{ kv('ANSIBLE_VAULT_PASSWORD') }}"
          SSH_PRIVATE_KEY: "{{ kv('SSH_PRIVATE_KEY') }}"
          ANSIBLE_VAULT_PASSWORD_FILE: /root/.config/ansible/vault-password
        beforeCommands:
          - apk add --no-cache curl bash openssh-client
          - curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
          - mkdir -p ~/.ssh /root/.config/ansible
          - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          - chmod 600 ~/.ssh/id_rsa
          - echo "$ANSIBLE_VAULT_PASSWORD" > /root/.config/ansible/vault-password
          - chmod 600 /root/.config/ansible/vault-password
        commands:
          - cd {{workingDir}} && just run-host backup bellamy
