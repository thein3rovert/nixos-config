id: failure-alert-discord
namespace: ops

description: >-
  Send a Discord alert whenever any flow execution ends in FAILED or WARNING.

triggers:
  - id: on_failure
    type: io.kestra.plugin.core.trigger.Flow
    dependsOn:
      - states:
          - FAILED
          - WARNING

tasks:
  - id: send_alert
    type: io.kestra.plugin.discord.DiscordExecution
    url: "{{ kv('DISCORD_WEBHOOK') }}"
    # trigger is absent on manual runs - fall back to this execution's own
    # ID so the flow is testable by hand as well as by real failures.
    executionId: "{{ trigger.executionId ?? execution.id }}"
